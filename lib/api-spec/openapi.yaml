openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: retention
    description: Draft-only retention generation and explicit message approvals
paths:
  /retention/reports:
    get:
      operationId: getRetentionReports
      tags: [retention]
      summary: Read club-scoped retention outcomes and opt-outs
      parameters:
        - $ref: "#/components/parameters/RetentionSlug"
        - name: playbook_key
          in: query
          required: false
          schema: { type: string, minLength: 1, maxLength: 120 }
        - name: period
          in: query
          required: false
          schema:
            type: string
            enum: [30d, 90d, all]
            default: 30d
      responses:
        "200":
          description: Read-only retention report data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetentionReportsResponse"
        "400": { description: Invalid report filters }
        "503": { description: Reporting migration is not installed }
  /operator-test-message:
    get:
      operationId: getOperatorTestMessages
      responses:
        "200":
          description: Operator test availability and persisted delivery results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperatorTestState"
    post:
      operationId: sendOperatorTestMessage
      responses:
        "200":
          description: One fixed message accepted by Twilio
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperatorTestResult"
        "403":
          description: Test override not configured
        "409":
          description: Live sending, kill switch, or send window blocked transport
  /retention/test-tools/candidates/{id}:
    post:
      operationId: ltpTestAction
      tags: [retention]
      summary: Audited test-only LTP action; never approves or sends
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: slug, in: query, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [action, actor]
              properties:
                action: { type: string, enum: [backdate, simulate_booking, dispatch_check, reset_simulated] }
                actor: { type: string, minLength: 1, maxLength: 120 }
      responses:
        "200":
          description: Audit entry or no-send dispatch-check result
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "403": { description: Test override absent }
        "409": { description: Not an eligible test candidate }
        "503": { description: Test-tools migration not installed }
  /retention/test-tools/draft-step2:
    post:
      operationId: draftLtpTestStep2
      tags: [retention]
      summary: Draft step 2 for explicitly selected backdated test step-1 candidates only
      parameters:
        - { name: slug, in: query, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [candidate_ids]
              properties:
                candidate_ids:
                  type: array
                  minItems: 1
                  maxItems: 50
                  uniqueItems: true
                  items: { type: string, format: uuid }
      responses:
        "200":
          description: Drafting results and failures
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "403": { description: Test override absent }
        "409": { description: Not an eligible test cohort }
        "503": { description: Test-tools migration not installed }
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Public aggregate operational health; no player data. Returns 503 when database or runtime schema is unavailable.
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
        "503":
          description: Degraded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /operator/login:
    get:
      operationId: operatorLoginPage
      summary: Public server-rendered operator login form
      responses:
        "200": {description: Login HTML}
    post:
      operationId: operatorLogin
      summary: Rate-limited single-operator password login
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [password]
              properties:
                password: {type: string}
                label: {type: string, maxLength: 80}
      responses:
        "303": {description: Secure httpOnly SameSite Strict session cookie and dashboard redirect}
        "401": {description: Invalid password}
        "429": {description: Too many attempts}
        "503": {description: Operator secret not configured}
  /operator/session:
    get:
      operationId: operatorSession
      summary: Current operator session
      responses:
        "200":
          description: Authenticated
          content:
            application/json:
              schema:
                type: object
                required: [authenticated, actor]
                properties:
                  authenticated: {type: boolean}
                  actor: {type: string}
        "401": {description: No operator session}
  /operator/logout:
    post:
      operationId: operatorLogout
      summary: Revoke operator session and clear cookie
      responses:
        "303": {description: Login redirect}
  /retention/approvals:
    get:
      operationId: listRetentionApprovals
      tags: [retention]
      summary: List retention candidates by status with global status counts
      parameters:
        - $ref: "#/components/parameters/RetentionClub"
        - $ref: "#/components/parameters/RetentionSlug"
        - $ref: "#/components/parameters/RetentionApprovalStatus"
      responses:
        "200":
          description: Filtered review history, global status counts, and explicit missing-schema state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetentionReview"
  /retention/generate:
    post:
      operationId: generateRetentionDrafts
      tags: [retention]
      summary: Generate first-ever Learn to Play drafts in a configurable lookback window; never approve or send
      parameters:
        - $ref: "#/components/parameters/RetentionClub"
        - $ref: "#/components/parameters/RetentionSlug"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RetentionGenerationInput"
      responses:
        "200":
          description: Draft-only results, eligibility counts, and coupon verification even when no candidates are found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetentionGenerationResult"
        "400":
          description: Invalid lookback_days input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetentionLtpSequenceOperationError"
        "503":
          description: Retention schema is unavailable; results may include drafts created before a per-candidate schema error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetentionGenerationResult"
  /retention/kill-switch:
    patch:
      operationId: updateRetentionKillSwitch
      tags: [retention]
      summary: Pause or resume the global club SMS stop, without approving any message
      parameters:
        - $ref: "#/components/parameters/RetentionClub"
        - $ref: "#/components/parameters/RetentionSlug"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RetentionPauseInput"
      responses:
        "200":
          description: Verified stop state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetentionActionResult"
  /retention/candidates/{id}:
    patch:
      operationId: editRetentionDraft
      tags: [retention]
      summary: Edit a pending draft and revoke any existing approval and schedule
      parameters:
        - $ref: "#/components/parameters/RetentionId"
        - $ref: "#/components/parameters/RetentionClub"
        - $ref: "#/components/parameters/RetentionSlug"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RetentionDraftUpdate"
      responses:
        "200":
          description: Updated draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetentionActionResult"
  /retention/candidates/{id}/approve:
    post:
      operationId: approveRetentionDraft
      tags: [retention]
      summary: Record explicit per-message approval and schedule the next open send slot
      parameters:
        - $ref: "#/components/parameters/RetentionId"
        - $ref: "#/components/parameters/RetentionClub"
        - $ref: "#/components/parameters/RetentionSlug"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RetentionApprovalInput"
      responses:
        "200":
          description: Approved, not synchronously sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetentionActionResult"
  /retention/candidates/{id}/regenerate:
    post:
      operationId: regenerateRetentionDraft
      tags: [retention]
      summary: Regenerate the stored text and context for an existing drafted candidate only
      description: Reuses the candidate row and never changes approved or sent candidates. The result can require context or a manual edit instead of yielding an approvable draft.
      parameters:
        - $ref: "#/components/parameters/RetentionId"
        - $ref: "#/components/parameters/RetentionClub"
        - $ref: "#/components/parameters/RetentionSlug"
      responses:
        "200":
          description: Updated candidate text and context
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetentionRegenerateResult"
        "409":
          description: Candidate is not currently drafted and cannot be regenerated
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error: {type: string}
  /retention/regenerate-batch:
    post:
      operationId: regenerateRetentionLtpBatch
      tags: [retention]
      summary: Rebuild a coherent ordered cohort of drafted LTP step-one messages only
      description: Uses live capacity ordering for the whole cohort, retains candidate/message identity and approval evidence, and only drafts. Never approves or sends.
      parameters:
        - $ref: "#/components/parameters/RetentionClub"
        - $ref: "#/components/parameters/RetentionSlug"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RetentionRegenerateBatchInput"
      responses:
        "200":
          description: Updated candidates, per-candidate failures, and actual PodPlay request telemetry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetentionRegenerateBatchResult"
        "400":
          description: Invalid candidate IDs
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error: {type: string}
        "409":
          description: The full capacity cohort changed or no longer fits live capacity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetentionLtpSequenceOperationError"
        "503":
          description: Migration 013 is not installed or ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetentionLtpSequenceOperationError"
  /retention/candidates/{id}/reshuffle:
    post:
      operationId: reshuffleRetentionLtpDraft
      tags: [retention]
      summary: Reselect seeded phrase slots for one drafted LTP candidate at either sequence step
      description: Updates one active, drafted, slot-based LTP step-one or step-two row only. Never approves or sends. Other playbooks do not expose reshuffling.
      parameters:
        - $ref: "#/components/parameters/RetentionId"
        - $ref: "#/components/parameters/RetentionClub"
        - $ref: "#/components/parameters/RetentionSlug"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RetentionReshuffleInput"
      responses:
        "200":
          description: Updated step-one or step-two draft text and its selected deterministic slot facts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetentionRegenerateResult"
        "409":
          description: Candidate is not an active drafted LTP candidate with matching step context
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetentionLtpSequenceOperationError"
        "503":
          description: Migration 013 is not installed or ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetentionLtpSequenceOperationError"
  /retention/playbooks/{key}/config:
    patch:
      operationId: updateRetentionLtpPhraseConfig
      tags: [retention]
      summary: Edit the stored two-step LTP phrase slots and follow-up gap
      description: Validates separate phrase arrays for steps one and two. This changes only playbook text configuration, never a sending setting.
      parameters:
        - name: key
          in: path
          required: true
          schema: {type: string}
        - $ref: "#/components/parameters/RetentionClub"
        - $ref: "#/components/parameters/RetentionSlug"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RetentionPlaybookConfigInput"
      responses:
        "200":
          description: Persisted, validated playbook phrase configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetentionPlaybook"
        "400":
          description: Invalid phrase slots or a step-two gap outside 7–30 days
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error: {type: string}
        "503":
          description: Migration 013 is not installed or ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetentionLtpSequenceOperationError"
  /retention/retry-context:
    post:
      operationId: retryRetentionContextBatch
      tags: [retention]
      summary: Retry PodPlay context lookup for eligible needs-context candidates only
      description: Only candidates with status needs_context and reason context_lookup_failed or no_next_program are eligible. This endpoint never changes drafted, approved, skipped, sent, or manual_edit candidates.
      parameters:
        - $ref: "#/components/parameters/RetentionClub"
        - $ref: "#/components/parameters/RetentionSlug"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RetentionRetryContextBatchInput"
      responses:
        "200":
          description: Per-candidate retry results and PodPlay retry telemetry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetentionRetryContextEnvelope"
        "400":
          description: Invalid or ineligible candidate IDs
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error: {type: string}
        "503":
          description: Retention schema migration 012 is unavailable
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error: {type: string}
  /retention/candidates/{id}/retry-context:
    post:
      operationId: retryRetentionContext
      tags: [retention]
      summary: Retry PodPlay context lookup for one eligible needs-context candidate
      description: Only candidates with status needs_context and reason context_lookup_failed or no_next_program are eligible. This endpoint never changes drafted, approved, skipped, sent, or manual_edit candidates.
      parameters:
        - $ref: "#/components/parameters/RetentionId"
        - $ref: "#/components/parameters/RetentionClub"
        - $ref: "#/components/parameters/RetentionSlug"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RetentionRetryContextSingleInput"
      responses:
        "200":
          description: Per-candidate retry result and PodPlay retry telemetry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetentionRetryContextEnvelope"
        "400":
          description: Candidate is not eligible for a context retry
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error: {type: string}
        "503":
          description: Retention schema migration 012 is unavailable
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error: {type: string}
  /retention/candidates/{id}/skip:
    post:
      operationId: skipRetentionDraft
      tags: [retention]
      summary: Skip without sending
      parameters:
        - $ref: "#/components/parameters/RetentionId"
        - $ref: "#/components/parameters/RetentionClub"
        - $ref: "#/components/parameters/RetentionSlug"
      responses:
        "200":
          description: Skipped
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetentionActionResult"
  /retention/playbooks/{key}/approve:
    post:
      operationId: approveRetentionPlaybookDrafts
      tags: [retention]
      summary: Approve only the explicit reviewed candidate IDs in one playbook
      parameters:
        - name: key
          in: path
          required: true
          schema: {type: string}
        - $ref: "#/components/parameters/RetentionClub"
        - $ref: "#/components/parameters/RetentionSlug"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RetentionBulkApprovalInput"
      responses:
        "200":
          description: Per-message approval results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RetentionActionResult"
components:
  parameters:
    RetentionClub:
      name: clubId
      in: query
      description: Club UUID; supply either clubId or slug
      schema: {type: string, format: uuid}
    RetentionSlug:
      name: slug
      in: query
      description: Club slug; supply either clubId or slug
      schema: {type: string}
    RetentionApprovalStatus:
      name: status
      in: query
      required: false
      description: Candidate status to list. all (the default) includes drafts, approved candidates, skipped history, sent history, and candidates needing context or manual edits.
      schema:
        type: string
        enum: [all, drafted, approved, skipped, sent, needs_context, manual_edit]
        default: all
    RetentionId:
      name: id
      in: path
      required: true
      schema: {type: string, format: uuid}
  schemas:
    RetentionReportsResponse:
      type: object
      additionalProperties: false
      required: [playbook_keys, outcomes, optouts, baseline, club_opt_out_total, period]
      properties:
        playbook_keys:
          type: array
          items: { type: string }
        outcomes:
          type: array
          items: { $ref: "#/components/schemas/RetentionPlaybookOutcome" }
        optouts:
          type: array
          items: { $ref: "#/components/schemas/RetentionSmsOptout" }
        baseline:
          oneOf:
            - $ref: "#/components/schemas/RetentionBaseline"
            - type: "null"
        club_opt_out_total: { type: integer, minimum: 0 }
        period: { type: string, enum: [30d, 90d, all] }
    RetentionPlaybookOutcome:
      type: object
      additionalProperties: false
      required:
        - sequence_id
        - player_id
        - name
        - playbook_key
        - step1_sent_at
        - step2_sent_at
        - last_sent_at
        - sequence_status
        - exit_reason
        - replied
        - booked
        - booked_event_id
        - booked_program_name
        - booking_created_at
        - credited_step
        - coupon_code_used
        - days_to_book
        - opted_out
        - opted_out_at
        - optout_after_step
        - optout_message_id
        - hours_to_optout
        - step1_drafted
        - step1_approved
        - step1_sent
        - step1_delivered
        - step1_booked
        - step2_drafted
        - step2_approved
        - step2_sent
        - step2_delivered
        - step2_booked
        - outcome
        - window_closes_at
        - is_test
      properties:
        sequence_id: { type: string, format: uuid }
        player_id: { type: string, format: uuid }
        name: { type: string }
        playbook_key: { type: string }
        step1_sent_at: { type: ["string", "null"], format: date-time }
        step2_sent_at: { type: ["string", "null"], format: date-time }
        last_sent_at: { type: ["string", "null"], format: date-time }
        sequence_status: { type: string }
        exit_reason: { type: ["string", "null"] }
        replied: { type: boolean }
        booked: { type: boolean }
        booked_event_id: { type: ["string", "null"] }
        booked_program_name: { type: ["string", "null"] }
        booking_created_at: { type: ["string", "null"], format: date-time }
        credited_step: { type: ["integer", "null"] }
        coupon_code_used: { type: ["string", "null"] }
        days_to_book: { type: ["number", "null"] }
        opted_out: { type: boolean }
        opted_out_at: { type: ["string", "null"], format: date-time }
        optout_after_step: { type: ["integer", "null"] }
        optout_message_id: { type: ["string", "null"], format: uuid }
        hours_to_optout: { type: ["number", "null"] }
        step1_drafted: { type: boolean }
        step1_approved: { type: boolean }
        step1_sent: { type: boolean }
        step1_delivered: { type: boolean }
        step1_booked: { type: boolean }
        step2_drafted: { type: boolean }
        step2_approved: { type: boolean }
        step2_sent: { type: boolean }
        step2_delivered: { type: boolean }
        step2_booked: { type: boolean }
        outcome: { type: string, enum: [booked, in_window, no_booking] }
        window_closes_at: { type: ["string", "null"], format: date-time }
        is_test: { type: boolean }
    RetentionSmsOptout:
      type: object
      additionalProperties: false
      required:
        - id
        - player_id
        - name
        - opted_out_at
        - source
        - event_source
        - twilio_optout_type
        - playbook_key
        - step
        - body
        - optout_message_id
      properties:
        id: { type: string, format: uuid }
        player_id: { type: ["string", "null"], format: uuid }
        name: { type: string }
        opted_out_at: { type: ["string", "null"], format: date-time }
        source: { type: string, enum: [stop_reply, carrier_21610, manual, unattributed] }
        event_source: { type: string, enum: [stop_reply, carrier_21610, manual] }
        twilio_optout_type: { type: ["string", "null"] }
        playbook_key: { type: ["string", "null"] }
        step: { type: ["integer", "null"] }
        body: { type: ["string", "null"] }
        optout_message_id: { type: ["string", "null"], format: uuid }
    RetentionBaseline:
      type: object
      additionalProperties: false
      required: [n_players, n_booked, rate]
      properties:
        n_players: { type: integer, minimum: 0 }
        n_booked: { type: integer, minimum: 0 }
        rate: { type: ["number", "null"] }
    OperatorTestResult:
      type: object
      required: [message_id, status, twilio_sid, delivery_status]
      properties:
        message_id: { type: string }
        status: { type: string }
        twilio_sid: { type: ["string", "null"] }
        delivery_status: { type: ["string", "null"] }
        error_message: { type: ["string", "null"] }
    OperatorTestState:
      type: object
      required: [available, messages]
      properties:
        available: { type: boolean }
        messages:
          type: array
          items:
            $ref: "#/components/schemas/OperatorTestResult"
    HealthStatus:
      type: object
      properties:
        status:
          type: string
        db_reachable: {type: boolean}
        runtime_schema_ready: {type: boolean}
        background_jobs: {type: boolean}
        last_queue_tick_at: {type: [string, "null"], format: date-time}
        last_nightly_sync:
          type: object
          properties:
            result: {type: string}
            at: {type: [string, "null"], format: date-time}
        sms_live: {type: boolean}
        paused: {type: [boolean, "null"]}
        alerts_configured: {type: boolean}
      required:
        - status
    RetentionDraftUpdate:
      type: object
      required: [body]
      properties:
        body: {type: string, minLength: 1}
    RetentionApprovalInput:
      type: object
      required: [approved_by, expected_body]
      properties:
        approved_by:
          type: string
          minLength: 1
          description: Explicit operator attribution label, not an authenticated identity
        expected_body:
          type: string
          minLength: 1
          description: Exact stored message text reviewed; stale approval requests are rejected
    RetentionBulkApprovalInput:
      type: object
      required: [approved_by, candidate_ids, expected_bodies]
      properties:
        approved_by: {type: string, minLength: 1}
        candidate_ids:
          type: array
          minItems: 1
          items: {type: string, format: uuid}
        expected_bodies:
          type: object
          additionalProperties: {type: string}
          description: Candidate ID to exact reviewed stored message text
    RetentionPauseInput:
      type: object
      required: [enabled]
      properties:
        enabled: {type: boolean}
    RetentionProgram:
      type: object
      required: [event_id, name, start_time, date, time, signup_url]
      properties:
        event_id: {type: string}
        name: {type: string}
        start_time: {type: string}
        date: {type: string}
        time: {type: string}
        signup_url: {type: string}
        spots_remaining: {type: integer}
    RetentionContext:
      type: object
      additionalProperties: true
      description: Context fields are optional for compatibility with legacy stored candidates. A missing variant is interpreted as with_program only when next_program is present; incomplete legacy contexts do not imply no_program.
      properties:
        variant:
          type: string
          enum: [with_program, no_program]
          description: Generation variant. Optional only for legacy contexts.
        player_first_name: {type: string}
        trigger:
          type: object
          required: [event_id, name, date]
          properties:
            event_id: {type: string}
            name: {type: string}
            date: {type: string}
        next_program:
          anyOf:
            - $ref: "#/components/schemas/RetentionProgram"
            - {type: "null"}
        booking_url:
          type: string
          const: "https://pbclub.podplay.app"
          description: Exact approved booking-page URL supplied for no_program contexts; optional on legacy with_program contexts.
        forbidden_program_names:
          type: array
          items: {type: string}
          description: Event, trigger, and configured program names that no_program text must not mention. Required for new no_program contexts; optional on legacy contexts.
        booked_event:
          anyOf:
            - $ref: "#/components/schemas/RetentionProgram"
            - {type: "null"}
        classmates_signed_up: {type: integer, minimum: 0}
        already_booked: {type: boolean}
        promo:
          type: [object, "null"]
          properties:
            code: {type: string}
            offer_text: {type: string}
        coupon_warning: {type: [string, "null"]}
        evaluated_at: {type: string}
        stale:
          type: boolean
          description: True when the candidate was generated with a test lookback longer than the production default.
        lookback_days: {type: integer, minimum: 1, maximum: 30}
        reason: {type: [string, "null"]}
        errors:
          type: array
          description: Lookup failures; entries may be strings or structured error objects.
          items: {}
        validation_errors:
          type: array
          items: {type: string}
        date_phrase:
          type: [string, "null"]
          description: Timing provenance retained in context. Required for new no_program contexts; no_program copy uses NOW/present-time framing following a Learn to Play thank-you.
        send_date: {type: [string, "null"]}
        send_date_et: {type: [string, "null"]}
        next_program_day: {type: [string, "null"]}
        generated_preview: {type: [string, "null"]}
        diagnostics: {}
        ltp_text:
          type: [object, "null"]
          description: Selected template slots and code-filled facts for deterministic LTP copy; absent on legacy model-built drafts.
          required: [step, seed_nonce, slot_indices, slot_templates, opener, ltp_date, when]
          properties:
            step: {type: integer, enum: [1, 2]}
            seed_nonce: {type: integer, minimum: 0}
            slot_indices:
              type: object
              additionalProperties: {type: integer, minimum: 0}
            opener: {type: string}
            slot_templates:
              type: object
              additionalProperties: {type: string}
            ltp_date: {type: string}
            when: {type: [string, "null"]}
    RetentionPlaybook:
      type: object
      required: [key, name, enabled, next_program_names, holdout_pct]
      properties:
        key: {type: string}
        name: {type: string}
        enabled: {type: boolean}
        promo_code: {type: [string, "null"]}
        offer_text: {type: [string, "null"]}
        next_program_names:
          type: array
          items: {type: string}
        message_guidance: {type: string}
        holdout_pct: {type: number, minimum: 0, maximum: 100}
        ltp_sequence_config:
          anyOf:
            - $ref: "#/components/schemas/LtpSequenceConfig"
            - {type: "null"}
    RetentionMessage:
      type: object
      required: [id, body, status]
      properties:
        id: {type: string}
        body: {type: string}
        status: {type: string}
        approved_at: {type: [string, "null"]}
        approved_by: {type: [string, "null"]}
        scheduled_send_at: {type: [string, "null"]}
        sent_at: {type: [string, "null"]}
        simulated: {type: boolean}
        retention_delivery_kind:
          type: [string, "null"]
          enum: [real, test, simulated, null]
    RetentionCandidate:
      type: object
      required: [id, player_id, playbook_key, trigger_event_id, status, context]
      properties:
        id: {type: string}
        player_id: {type: string}
        playbook_key: {type: string}
        trigger_event_id: {type: string}
        status: {type: string, enum: [drafted, approved, skipped, sent, needs_context, manual_edit]}
        step: {type: integer, enum: [1, 2], default: 1}
        sequence_id: {type: [string, "null"], format: uuid}
        sequence_status:
          type: [string, "null"]
          enum: [active, paused_reply, exited_booked, exited_opt_out, completed, null]
        exited_at: {type: [string, "null"]}
        exit_reason: {type: [string, "null"]}
        booked_event_id: {type: [string, "null"]}
        step1_text: {type: [string, "null"], description: Present on step-two approval cards for operator review.}
        step1_sent_at: {type: [string, "null"], description: Real step-one sent timestamp displayed on step-two cards.}
        context:
          $ref: "#/components/schemas/RetentionContext"
        player:
          type: object
          properties:
            name: {type: [string, "null"]}
        message:
          anyOf:
            - $ref: "#/components/schemas/RetentionMessage"
            - {type: "null"}
    RetentionReview:
      type: object
      required: [schema_ready, retry_context_ready, sequence_schema_ready, playbooks, candidates, warnings, mode]
      properties:
        schema_ready:
          type: boolean
          description: Readiness of the core retention schema from migration 011
        retry_context_ready:
          type: boolean
          description: Readiness of retry-context support from migration 012, independent of schema_ready
        sequence_schema_ready:
          type: boolean
          description: Readiness of LTP sequence safety, slot configuration, and atomic capacity/dispatch RPCs from migration 013.
        error: {type: string}
        counts:
          $ref: "#/components/schemas/RetentionApprovalCounts"
        playbooks:
          type: array
          items:
            $ref: "#/components/schemas/RetentionPlaybook"
        candidates:
          type: array
          items:
            $ref: "#/components/schemas/RetentionCandidate"
        warnings:
          type: array
          items: {type: string}
        mode:
          type: object
          required: [retention_only, require_marketing_consent]
          properties:
            retention_only: {type: boolean}
            require_marketing_consent: {type: boolean}
            sms_live: {type: boolean}
            test_override_configured: {type: boolean}
            kill_switch: {type: [boolean, "null"]}
    RetentionApprovalCounts:
      type: object
      description: Global candidate totals, independent of the requested status filter. all is the total across every candidate status.
      required: [all, drafted, approved, skipped, sent, needs_context, manual_edit]
      properties:
        all: {type: integer, minimum: 0}
        drafted: {type: integer, minimum: 0}
        approved: {type: integer, minimum: 0}
        skipped: {type: integer, minimum: 0}
        sent: {type: integer, minimum: 0}
        needs_context: {type: integer, minimum: 0}
        manual_edit: {type: integer, minimum: 0}
    RetentionGenerationResult:
      type: object
      additionalProperties: true
      required: [schema_ready, lookback_days, created, skipped, needs_context, manual_edit, errors, stats, coupon_check, drafts]
      properties:
        schema_ready: {type: boolean}
        lookback_days:
          type: integer
          minimum: 1
          maximum: 30
          description: Effective lookback after values above 30 are clamped to 30; defaults to 3
        created: {type: integer}
        skipped: {type: integer}
        needs_context: {type: integer, minimum: 0}
        manual_edit: {type: integer, minimum: 0}
        errors:
          type: array
          description: Per-candidate or generation failures; errors are not included in skipped
          items: {type: string}
        stats:
          $ref: "#/components/schemas/RetentionGenerationStats"
        coupon_check:
          $ref: "#/components/schemas/RetentionCouponCheck"
        drafts:
          type: array
          description: Only candidates newly created by this call
          items:
            $ref: "#/components/schemas/RetentionGeneratedDraft"
    RetentionGenerationInput:
      type: object
      additionalProperties: false
      properties:
        lookback_days:
          type: integer
          minimum: 1
          description: Positive integer; omitted defaults to 3 and values above 30 are accepted then clamped to 30
    RetentionGenerationStats:
      type: object
      additionalProperties: true
      description: found counts first-ever LTP attendance candidates in the conservative raw-date window; verified counts PodPlay-corroborated LTP triggers including out-of-window triggers; new_ltp_players counts verified triggers inside the effective date window. For a completed generation, created plus skipped plus needs_context plus manual_edit plus error_count accounts for found candidates.
      required: [found, verified, new_ltp_players, created, skipped, needs_context, manual_edit, error_count, errors, skipped_by_reason]
      properties:
        found: {type: integer, minimum: 0}
        verified: {type: integer, minimum: 0}
        new_ltp_players: {type: integer, minimum: 0}
        created: {type: integer, minimum: 0}
        skipped: {type: integer, minimum: 0}
        needs_context: {type: integer, minimum: 0}
        manual_edit: {type: integer, minimum: 0}
        error_count: {type: integer, minimum: 0}
        errors:
          type: array
          description: Compatibility detail array matching top-level errors; use error_count for the count
          items: {type: string}
        skipped_by_reason:
          $ref: "#/components/schemas/RetentionGenerationSkippedCounts"
    RetentionGenerationSkippedCounts:
      type: object
      additionalProperties: false
      required: [no_phone, opted_out, duplicate, holdout, marketing_consent, missing_player, invalid_trigger, out_of_window, already_returned]
      properties:
        no_phone: {type: integer, minimum: 0}
        opted_out: {type: integer, minimum: 0}
        duplicate: {type: integer, minimum: 0}
        holdout: {type: integer, minimum: 0}
        marketing_consent: {type: integer, minimum: 0}
        missing_player: {type: integer, minimum: 0}
        invalid_trigger: {type: integer, minimum: 0}
        out_of_window: {type: integer, minimum: 0}
        already_returned: {type: integer, minimum: 0}
    RetentionCouponCheck:
      type: object
      additionalProperties: false
      required: [code, valid, warning]
      properties:
        code: {type: ["string", "null"]}
        valid: {type: ["boolean", "null"]}
        warning: {type: ["string", "null"]}
      description: Null values mean no promo coupon is configured. A configured coupon is checked even when there are no candidate players.
    RetentionGeneratedDraft:
      type: object
      additionalProperties: false
      required: [candidate_id, player_id, player_name, status, reason, body, context]
      properties:
        candidate_id: {type: string}
        player_id: {type: string}
        player_name: {type: ["string", "null"]}
        status: {type: string, enum: [drafted, needs_context, manual_edit, skipped]}
        reason: {type: [string, "null"]}
        body:
          type: [string, "null"]
          description: Exact persisted draft body; null when context, validation, or already-returned checks block drafting
        context:
          $ref: "#/components/schemas/RetentionContext"
        step: {type: integer, enum: [1, 2]}
        sequence_status:
          type: [string, "null"]
          enum: [active, paused_reply, exited_booked, exited_opt_out, completed, null]
        validation_errors:
          type: array
          items: {type: string}
    RetentionActionResult:
      type: object
      additionalProperties: true
      properties:
        approved: {type: integer}
        candidate:
          $ref: "#/components/schemas/RetentionCandidate"
        errors: {type: array, items: {}}
    RetentionRegenerateResult:
      type: object
      required: [candidate_id, status, reason, body, context]
      properties:
        candidate_id: {type: string}
        status: {type: string, enum: [drafted, needs_context, manual_edit, skipped]}
        reason: {type: [string, "null"]}
        body: {type: [string, "null"]}
        context:
          $ref: "#/components/schemas/RetentionContext"
        validation_errors:
          type: array
          items: {type: string}
    RetentionRegenerateBatchInput:
      type: object
      additionalProperties: false
      required: [candidate_ids]
      properties:
        candidate_ids:
          type: array
          minItems: 1
          maxItems: 50
          uniqueItems: true
          items: {type: string, format: uuid}
    RetentionReshuffleInput:
      type: object
      additionalProperties: false
    RetentionLtpSequenceOperationError:
      type: object
      additionalProperties: true
      required: [schema_ready, error]
      properties:
        schema_ready:
          type: boolean
          description: False when the sequence schema readiness check failed; true after it passed.
        error: {type: string}
    RetentionRegenerateBatchResult:
      type: object
      additionalProperties: true
      required: [schema_ready, results, podplay]
      properties:
        schema_ready: {type: boolean}
        results:
          type: array
          items:
            $ref: "#/components/schemas/RetentionRegenerateResult"
        failures:
          type: array
          items:
            $ref: "#/components/schemas/RetentionRetryContextFailure"
        podplay:
          $ref: "#/components/schemas/RetentionPodplayTelemetry"
    RetentionPlaybookConfigInput:
      type: object
      additionalProperties: false
      required: [ltp_sequence_config]
      properties:
        ltp_sequence_config:
          $ref: "#/components/schemas/LtpSequenceConfig"
    LtpSequenceConfig:
      type: object
      additionalProperties: false
      required: [step2_gap_days, step1, step2]
      properties:
        step2_gap_days:
          type: integer
          minimum: 7
          maximum: 30
          default: 7
        step1:
          $ref: "#/components/schemas/LtpStepOnePhraseSlots"
        step2:
          $ref: "#/components/schemas/LtpStepTwoPhraseSlots"
    LtpStepOnePhraseSlots:
      type: object
      additionalProperties: false
      required: [opener, thanks, next_step, offer, offer_no_program]
      properties:
        opener: {$ref: "#/components/schemas/LtpPhraseArray"}
        thanks: {$ref: "#/components/schemas/LtpPhraseArray"}
        next_step: {$ref: "#/components/schemas/LtpPhraseArray"}
        offer: {$ref: "#/components/schemas/LtpPhraseArray"}
        offer_no_program: {$ref: "#/components/schemas/LtpPhraseArray"}
    LtpStepTwoPhraseSlots:
      type: object
      additionalProperties: false
      required: [opener, nudge, next_step, no_program_cta]
      properties:
        opener: {$ref: "#/components/schemas/LtpPhraseArray"}
        nudge: {$ref: "#/components/schemas/LtpPhraseArray"}
        next_step: {$ref: "#/components/schemas/LtpPhraseArray"}
        no_program_cta: {$ref: "#/components/schemas/LtpPhraseArray"}
    LtpPhraseArray:
      type: array
      minItems: 1
      maxItems: 32
      items:
        type: string
        minLength: 1
        maxLength: 240
        pattern: '\S'
    RetentionRetryContextSingleInput:
      type: object
      additionalProperties: false
    RetentionRetryContextBatchInput:
      type: object
      additionalProperties: false
      required: [candidate_ids]
      properties:
        candidate_ids:
          type: array
          minItems: 1
          maxItems: 50
          uniqueItems: true
          items: {type: string, format: uuid}
    RetentionRetryContextEnvelope:
      type: object
      additionalProperties: true
      required: [schema_ready, results, podplay]
      properties:
        schema_ready:
          type: boolean
          description: True only when both the core retention schema (migration 011) and retry-context schema (migration 012) were checked and are ready.
        results:
          type: array
          items:
            $ref: "#/components/schemas/RetentionRegenerateResult"
        failures:
          type: array
          description: Per-candidate failures that did not prevent other successful candidate results from being persisted.
          items:
            $ref: "#/components/schemas/RetentionRetryContextFailure"
        podplay:
          $ref: "#/components/schemas/RetentionPodplayTelemetry"
    RetentionRetryContextFailure:
      type: object
      additionalProperties: false
      required: [candidate_id, error, http_status]
      properties:
        candidate_id: {type: string, format: uuid}
        error: {type: string}
        http_status: {type: integer}
    RetentionPodplayTelemetry:
      type: object
      additionalProperties: false
      required: [total_calls, listing_calls, signup_calls, trigger_calls, coupon_calls, rate_limit_count, retries]
      properties:
        total_calls: {type: integer, minimum: 0}
        listing_calls: {type: integer, minimum: 0}
        signup_calls: {type: integer, minimum: 0}
        trigger_calls: {type: integer, minimum: 0}
        coupon_calls: {type: integer, minimum: 0}
        rate_limit_count: {type: integer, minimum: 0}
        retries:
          type: array
          items:
            $ref: "#/components/schemas/RetentionPodplayRetry"
    RetentionPodplayRetry:
      type: object
      additionalProperties: false
      required: [path, attempt, retry_number, wait_ms, status]
      properties:
        path: {type: string}
        attempt: {type: integer, minimum: 0}
        retry_number: {type: integer, minimum: 0}
        wait_ms: {type: integer, minimum: 0}
        status: {type: integer}

